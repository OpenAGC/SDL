[binaries]
c = 'prospero-clang'
cpp = 'prospero-clang++'
objc = 'prospero-clang'
objcpp = 'prospero-clang++'
ld = 'prospero-lld'
ar = 'prospero-ar'
strip = 'prospero-strip'
cmake = 'prospero-cmake'
pkg-config = 'prospero-pkg-config'

[host_machine]
system = 'prospero'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
prefix = '/user/homebrew'
default_library = 'static'
c_args = ['-Wno-unreachable-code-generic-assoc']
cpp_args = ['-Wno-unreachable-code-generic-assoc']

[properties]
needs_exe_wrapper = true
